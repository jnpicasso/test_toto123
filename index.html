<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Boutique de T-shirts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-100 text-gray-900 antialiased">

    <div id="app" class="max-w-md mx-auto p-4">
        <header class="text-center py-6">
            <h1 class="text-2xl font-bold">T-shirt "Édition Limitée"</h1>
        </header>

        <div class="bg-white rounded-2xl shadow-sm overflow-hidden mb-6">
            <img src="https://via.placeholder.com/400x400" alt="T-shirt" class="w-full h-64 object-cover">
            <div class="p-4">
                <p class="text-gray-600 text-sm mb-2">Coton 100% bio - Design exclusif</p>
                <span class="text-xl font-bold text-blue-600">25,00 €</span>
            </div>
        </div>

        <div class="mb-8">
            <label class="block text-sm font-medium text-gray-700 mb-2">Choisir une taille :</label>
            <div class="flex gap-4">
                <button onclick="selectSize('S')" class="size-btn border-2 border-gray-200 rounded-lg px-4 py-2 hover:border-blue-500 focus:bg-blue-50 text-center flex-1">S</button>
                <button onclick="selectSize('M')" class="size-btn border-2 border-gray-200 rounded-lg px-4 py-2 hover:border-blue-500 focus:bg-blue-50 text-center flex-1">M</button>
                <button onclick="selectSize('L')" class="size-btn border-2 border-gray-200 rounded-lg px-4 py-2 hover:border-blue-500 focus:bg-blue-50 text-center flex-1">L</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        let selectedSize = null;

        // Initialisation de la Mini App
        tg.ready();
        tg.expand(); // Ouvre l'app en plein écran

        function selectSize(size) {
            selectedSize = size;
            
            // On configure le bouton principal de Telegram
            tg.MainButton.text = `Commander Taille ${size} - 25,00 €`;
            tg.MainButton.show();
            
            // Petit feedback visuel sur les boutons
            document.querySelectorAll('.size-btn').forEach(btn => {
                btn.classList.remove('border-blue-500', 'bg-blue-50');
            });
            event.target.classList.add('border-blue-500', 'bg-blue-50');
        }

        // Action quand l'utilisateur clique sur le bouton "Commander" de Telegram
        tg.onEvent('mainButtonClicked', function() {
            tg.sendData(JSON.stringify({
                item: "T-shirt Edition Limitée",
                size: selectedSize,
                price: 25.00
            }));
            // Note : tg.sendData ferme la Mini App et envoie les infos au bot
        });
    </script>
</body>
</html>
